plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    //
    id 'kotlin-kapt'
}

android {
    namespace 'com.zhiyi.android_first_demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhiyi.android_first_demo"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0' // 升级以更好匹配 SDK 34
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' // 下拉组件
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // 3. 协程
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // 4. 网络请求：Retrofit 2.11.0
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    // 5. 图片加载库：Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"
    // 🌟【核心新增】既然开启了 kapt 插件，Glide 的注解处理器也要用 kapt 引入
    kapt "com.github.bumptech.glide:compiler:4.16.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // 日志库
    implementation("com.jakewharton.timber:timber:5.0.1")


}
